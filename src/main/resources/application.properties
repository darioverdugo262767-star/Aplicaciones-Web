spring.application.name=PokemonApi

# Configuracion de conexion a la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/pokemon_api_db?serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Crear y actualizar las tablas automaticamente
spring.jpa.hibernate.ddl-auto=update
